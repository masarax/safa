version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      composer-safe-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      android-safe-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      github-actions-safe-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
      include: scope
