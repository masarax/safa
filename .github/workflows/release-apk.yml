name: Build Signed Android Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: safa-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-android-release:
    name: Validate and build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact release commit with main history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Require exact full Android Production CI success
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/verify-android-release-eligibility.sh
          scripts/verify-android-release-eligibility.sh | tee "$RUNNER_TEMP/release-validation.txt"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate release version identity
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^SAFA_VERSION_CODE=//p' gradle.properties | tail -n 1 | tr -d '[:space:]')"
          published="$(tr -d '[:space:]' < release/android-last-published-version-code.txt)"
          [[ "$current" =~ ^[0-9]+$ ]] || { echo 'SAFA_VERSION_CODE must be an integer'; exit 1; }
          [[ "$published" =~ ^[0-9]+$ ]] || { echo 'Published version baseline must be an integer'; exit 1; }
          test "$current" -gt "$published" || { echo "Release versionCode $current must be greater than last published code $published"; exit 1; }

      # Signing secrets are deliberately not read or decoded until provenance,
      # main ancestry, tag/version identity and full Android CI are validated.
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is required'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'ANDROID_STORE_PASSWORD is required'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safa-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/safa-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      # Keep a local defense-in-depth test/lint pass even though the exact SHA
      # has already passed the stronger CI including emulator/runtime smoke.
      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build minified signed APK and Play App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/safa-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Generate commit-bound Android SBOM
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:safaResolvedReleaseDependencies
          version="$(sed -n 's/^SAFA_VERSION_NAME=//p' gradle.properties | tail -n 1 | tr -d '[:space:]')"
          python3 scripts/generate-sbom.py \
            --target android \
            --input app/build/reports/security/release-dependencies.txt \
            --output app/build/release-publication/safa-android.cdx.json \
            --commit "$GITHUB_SHA" \
            --version "$version"

      - name: Verify signatures and create provenance
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk" || { echo 'Release APK was not produced'; exit 1; }
          test -n "$aab" || { echo 'Release AAB was not produced'; exit 1; }

          apksigner verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          jarsigner -verify -strict -certs "$aab" >/dev/null
          keytool -list -v \
            -keystore "$RUNNER_TEMP/safa-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | sed -n '/SHA256:/p' | head -n 1 > "$RUNNER_TEMP/signing-certificate.txt"
          test -s "$RUNNER_TEMP/signing-certificate.txt" || { echo 'Signing certificate SHA-256 was not resolved'; exit 1; }

          mkdir -p app/build/release-publication
          : > app/build/release-publication/SHA256SUMS.txt
          sha256sum "$apk" | sed "s#${apk}#$(basename "$apk")#" >> app/build/release-publication/SHA256SUMS.txt
          sha256sum "$aab" | sed "s#${aab}#$(basename "$aab")#" >> app/build/release-publication/SHA256SUMS.txt
          sha256sum app/build/release-publication/safa-android.cdx.json | sed 's#app/build/release-publication/##' >> app/build/release-publication/SHA256SUMS.txt

          version_code="$(sed -n 's/^SAFA_VERSION_CODE=//p' gradle.properties | tail -n 1 | tr -d '[:space:]')"
          version_name="$(sed -n 's/^SAFA_VERSION_NAME=//p' gradle.properties | tail -n 1 | tr -d '[:space:]')"
          {
            printf 'commit=%s\nref=%s\npackage=com.safa.account\nversionCode=%s\nversionName=%s\n' \
              "$GITHUB_SHA" "$GITHUB_REF" "$version_code" "$version_name"
            printf 'artifact_apk=%s\nartifact_aab=%s\n' "$(basename "$apk")" "$(basename "$aab")"
            printf 'signing_certificate_'
            tr -d '\r\n' < "$RUNNER_TEMP/signing-certificate.txt"
            printf '\n'
            cat "$RUNNER_TEMP/release-validation.txt"
          } > app/build/release-publication/build-identity.txt

      - name: Upload APK, AAB, mapping, SBOM and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safa-signed-android-release-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/release-publication/SHA256SUMS.txt
            app/build/release-publication/build-identity.txt
            app/build/release-publication/safa-android.cdx.json

      - name: Remove decoded signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/safa-release.jks"
