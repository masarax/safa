name: Manual Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK type to build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      clean_build:
        description: "Run a clean build before assembling the APK"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build-apk:
    name: Manual ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure release signing
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is required for release APKs."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safa-release.jks"
          test -s "$RUNNER_TEMP/safa-release.jks"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Assemble APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/safa-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.build_type }}" == "release" ]]; then
            test -n "$STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required."; exit 1; }
            test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is required."; exit 1; }
            test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is required."; exit 1; }
          fi
          if [[ "${{ inputs.clean_build }}" == "true" ]]; then
            ./gradlew clean --no-daemon
          fi
          ./gradlew "assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}" --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "Built: $apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAFA-${{ inputs.build_type }}-APK-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
