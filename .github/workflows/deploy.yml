name: Deploy Laravel Backend to cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-laravel-production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy Laravel backend to cPanel
    runs-on: [self-hosted, windows, x64, safa]
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0
      - name: Prepare test database
        working-directory: backend
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force database | Out-Null
          if (Test-Path database/testing.sqlite) { Remove-Item database/testing.sqlite -Force }
          New-Item -ItemType File database/testing.sqlite | Out-Null
      - name: Install Composer test dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: PHP syntax check
        working-directory: backend
        shell: powershell
        run: Get-ChildItem app,config,database,routes,tests -Recurse -Filter *.php | ForEach-Object { php -l $_.FullName }
      - name: Run mandatory full test suite
        working-directory: backend
        run: php -d memory_limit=1G -d max_execution_time=0 -d opcache.enable=0 -d opcache.jit=0 artisan test --no-coverage --do-not-cache-result
      - name: Install production Composer dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      - name: Sync Laravel backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: /
          exclude: |
            .git*
            .env
            .env.*
            database/testing.sqlite
            storage/installed
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            tests/
            node_modules/
      - name: Production health smoke check
        shell: powershell
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          if (-not $env:PRODUCTION_BASE_URL) { throw 'PRODUCTION_BASE_URL is required' }
          $base = $env:PRODUCTION_BASE_URL.TrimEnd('/')
          $health = Invoke-WebRequest -Uri "$base/api/health" -UseBasicParsing -TimeoutSec 20
          if ($health.StatusCode -ne 200) { throw "Health check failed: $($health.StatusCode)" }
          $version = Invoke-WebRequest -Uri "$base/api/version" -UseBasicParsing -TimeoutSec 20
          if ($version.StatusCode -ne 200) { throw "Version check failed: $($version.StatusCode)" }
