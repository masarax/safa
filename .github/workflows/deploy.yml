name: Deploy Laravel Backend to cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-laravel-production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy Laravel backend to cPanel
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0

      - name: Prepare test database
        working-directory: backend
        run: |
          mkdir -p database
          rm -f database/testing.sqlite
          touch database/testing.sqlite

      - name: Install Composer test dependencies
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/testing.sqlite
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP syntax check
        working-directory: backend
        run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run mandatory full test suite
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG: 'false'
          APP_URL: http://localhost
          DB_CONNECTION: sqlite
          DB_DATABASE: database/testing.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          SAFA_API_KEY: safa_testing_key
          SAFA_API_SECRET: safa_testing_secret
          DB_UPDATE_SECRET: safa_testing_update_secret
          XDEBUG_MODE: off
        run: php -d memory_limit=1G -d max_execution_time=0 -d opcache.enable=0 -d opcache.jit=0 artisan test --no-coverage --do-not-cache-result

      - name: Install production Composer dependencies
        working-directory: backend
        env:
          APP_ENV: production
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG: 'false'
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Sync Laravel backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: /
          exclude: |
            .git*
            .env
            .env.*
            database/testing.sqlite
            storage/installed
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            tests/
            node_modules/
