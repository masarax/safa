name: Deploy Laravel Backend to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-laravel-production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy Laravel backend to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0
      - name: Prepare test database
        working-directory: backend
        shell: bash
        run: |
          mkdir -p database
          rm -f database/testing.sqlite
          touch database/testing.sqlite
      - name: Install Composer test dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: PHP syntax check
        working-directory: backend
        run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run mandatory full test suite
        working-directory: backend
        run: php -d memory_limit=1G -d max_execution_time=0 -d opcache.enable=0 -d opcache.jit=0 artisan test --no-coverage --do-not-cache-result
      - name: Install production Composer dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      - name: Sync Laravel backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: /
          exclude: |
            .git*
            .env
            .env.*
            database/testing.sqlite
            storage/installed
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            tests/
            node_modules/
      - name: Production health smoke check
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          test -n "$PRODUCTION_BASE_URL" || { echo 'PRODUCTION_BASE_URL is required'; exit 1; }
          base="${PRODUCTION_BASE_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$base/api/health" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$base/api/version" >/dev/null
