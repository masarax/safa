name: Deploy Laravel Backend to cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-laravel-production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy Laravel backend to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0
      - name: Prepare CI environment
        working-directory: backend
        shell: bash
        run: |
          mkdir -p database
          rm -f database/testing.sqlite
          touch database/testing.sqlite
          cp .env.example .env
          php -r '$env=file_get_contents(".env"); $key="base64:".base64_encode(random_bytes(32)); $env=preg_replace("/^APP_KEY=.*$/m", "APP_KEY=$key", $env); $env=preg_replace("/^DB_CONNECTION=.*$/m", "DB_CONNECTION=sqlite", $env); $env=preg_replace("/^DB_DATABASE=.*$/m", "DB_DATABASE=".getcwd()."/database/testing.sqlite", $env); file_put_contents(".env", $env);'
      - name: Install Composer test dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: PHP syntax check
        working-directory: backend
        run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run mandatory full test suite
        working-directory: backend
        run: php -d memory_limit=1G -d max_execution_time=0 -d opcache.enable=0 -d opcache.jit=0 artisan test --no-coverage --do-not-cache-result
      - name: Install production Composer dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      - name: Sync Laravel backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: /
          exclude: |
            .git*
            .env
            .env.*
            database/testing.sqlite
            storage/installed
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            tests/
            node_modules/
      - name: Production smoke verification
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_BASE_URL" || { echo 'PRODUCTION_BASE_URL is required'; exit 1; }
          base="${PRODUCTION_BASE_URL%/}"
          case "$base" in
            https://*) ;;
            *) echo 'Production smoke checks require an HTTPS base URL'; exit 1 ;;
          esac

          health_json="$(curl --fail --silent --show-error --max-time 20 "$base/api/auth/health")"
          HEALTH_JSON="$health_json" php -r '$d=json_decode(getenv("HEALTH_JSON"), true); if (!is_array($d) || ($d["status"] ?? null) !== "ok" || ($d["service"] ?? null) !== "SAFA API") { fwrite(STDERR, "Unexpected health payload\n"); exit(1); }'

          for path in / /install /install/update /install/update-process /update-db; do
            body_file="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --output "$body_file" --write-out '%{http_code}' "$base$path")"
            test "$code" = "404" || { echo "Expected 404 for $path, received $code"; cat "$body_file"; rm -f "$body_file"; exit 1; }
            BODY_FILE="$body_file" php -r '$d=json_decode(file_get_contents(getenv("BODY_FILE")), true); if (!is_array($d) || ($d["status"] ?? null) !== "not_found") { fwrite(STDERR, "Unexpected private-surface payload\n"); exit(1); }'
            rm -f "$body_file"
          done

          # Protected critical routes must exist, but smoke verification never sends
          # production credentials or mutates business data. Authentication denial
          # proves the route is deployed without weakening its security boundary.
          for path in /api/version/check /api/v1/customers /api/v1/sync/down; do
            code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$base$path")"
            case "$code" in
              401|403|429) ;;
              *) echo "Unexpected status $code for protected route $path"; exit 1 ;;
            esac
          done
