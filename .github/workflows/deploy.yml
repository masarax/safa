name: Deploy Laravel Backend to cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-laravel-production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy Laravel backend to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0

      - name: Prepare deterministic test environment
        working-directory: backend
        run: cp .env.testing .env

      - name: Install Composer test dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP syntax check
        working-directory: backend
        run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run mandatory full test suite
        working-directory: backend
        env:
          XDEBUG_MODE: off
        run: php -d memory_limit=1G -d max_execution_time=0 artisan test --no-coverage --do-not-cache-result

      - name: Install production Composer dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Verify cPanel deployment target
        run: |
          echo "Deploying Laravel public entry point through the configured cPanel document-root layout."
          echo "Production .env remains server-side and is never uploaded from GitHub."

      - name: Sync Laravel backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: /
          exclude: |
            .git*
            .env
            .env.*
            storage/installed
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            tests/
            node_modules/

      - name: Verify production API health
        env:
          SAFA_PRODUCTION_URL: https://safa.masarax.com
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 "$SAFA_PRODUCTION_URL/api/auth/health")"
          printf '%s\n' "$response" | grep -q '"status":"ok"'
          printf '%s\n' "$response" | grep -q '"service":"SAFA API"'
