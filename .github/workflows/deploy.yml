name: Deploy Laravel Backend to cPanel

on:
  workflow_dispatch:

jobs:
  web-deploy:
    name: Audit, test and deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none

      - name: Install Composer dependencies for tests
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: PHP syntax audit
        run: |
          set -euo pipefail
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Laravel route and automated test audit
        run: |
          set -euo pipefail
          cd backend
          php artisan route:list --except-vendor
          php artisan test --without-tty

      - name: Install production Composer dependencies
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Sync FTP Files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: /
          exclude: |
            .git*
            .env
            .env.*
            storage/installed
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            tests/
            node_modules/
