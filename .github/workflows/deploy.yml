name: Deploy Laravel Backend to cPanel

on:
  workflow_run:
    workflows: ["Laravel Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: safa-laravel-production-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy exact CI-tested Laravel backend commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact CI-tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify deployment provenance and ordering
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY" || { echo 'Refusing deployment from a different repository.'; exit 1; }
          test "$SOURCE_BRANCH" = "$DEFAULT_BRANCH" || { echo 'Refusing deployment from a non-default branch.'; exit 1; }
          [[ "$TESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'CI-tested SHA is invalid.'; exit 1; }

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKED_OUT_SHA" = "$TESTED_SHA" || { echo 'Checked-out commit does not match the successful CI run.'; exit 1; }

          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          CURRENT_DEFAULT_SHA="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
          test "$CURRENT_DEFAULT_SHA" = "$TESTED_SHA" || {
            echo "Refusing stale deployment: tested $TESTED_SHA but current $DEFAULT_BRANCH is $CURRENT_DEFAULT_SHA."
            exit 1
          }

          echo "DEPLOY_SHA=$TESTED_SHA" >> "$GITHUB_ENV"

      - name: Verify immutable workflow action pins
        run: bash scripts/check-workflow-action-pins.sh

      - name: Verify deployment provenance contract
        run: bash scripts/check-deploy-provenance.sh

      - name: Set up PHP for Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none

      - name: Prepare production dependencies for upload
        working-directory: backend
        env:
          APP_ENV: production
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG: 'false'
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Stamp deployed commit identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          printf '{"commit":"%s"}\n' "$DEPLOY_SHA" > backend/bootstrap/safa-build.json

      - name: Reconfirm tested commit is still current main
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          CURRENT_DEFAULT_SHA="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
          test "$CURRENT_DEFAULT_SHA" = "$DEPLOY_SHA" || {
            echo "Refusing stale deployment immediately before upload: tested $DEPLOY_SHA but current $DEFAULT_BRANCH is $CURRENT_DEFAULT_SHA."
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(php -r '$m=json_decode(file_get_contents("backend/bootstrap/safa-build.json"), true); echo $m["commit"] ?? "";')" = "$DEPLOY_SHA"

      - name: Sync Laravel backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: /
          exclude: |
            .git*
            .env
            .env.*
            database/testing.sqlite
            public/storage/logos/**
            storage/installed
            storage/framework/cache/*
            storage/framework/sessions/*
            storage/framework/views/*
            storage/logs/*
            tests/
            node_modules/
