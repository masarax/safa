name: Issue 245 WCAG fixes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-245-wcag-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'i18n/245-web-accessibility'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: i18n/245-web-accessibility
          fetch-depth: 0

      - name: Apply shared WCAG fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('backend/public/safa-web-product.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = {
              '--muted:#5f7069;': '--muted:#465951;',
              '--muted-2:#87968f;': '--muted-2:#596a63;',
              '--brand-orange:#f97316;': '--brand-orange:#c2410c;',
              '--brand-orange-2:#ea580c;': '--brand-orange-2:#9a3412;',
              '.icon-button{width:40px;height:40px;min-height:40px;': '.icon-button{width:48px;height:48px;min-height:48px;',
              '.screen-title .primary-button{min-height:34px;height:34px;': '.screen-title .primary-button{min-height:44px;height:44px;',
              '.screen-title .compact-button{height:34px;min-height:34px;': '.screen-title .compact-button{height:44px;min-height:44px;',
              '.round-action{width:40px;height:40px;min-height:40px;': '.round-action{width:44px;height:44px;min-height:44px;',
              '.language-switch a{min-height:34px;': '.language-switch a{min-height:44px;',
              '.subpage-toolbar .icon-button{width:38px;height:38px;min-height:38px}': '.subpage-toolbar .icon-button{width:44px;height:44px;min-height:44px}',
              '.screen-title .primary-button,.screen-title .compact-button{height:38px;min-height:38px}': '.screen-title .primary-button,.screen-title .compact-button{height:44px;min-height:44px}',
              '.app-topbar .icon-button{width:36px;height:36px;min-height:36px}': '.app-topbar .icon-button{width:44px;height:44px;min-height:44px}',
              '@keyframes screen-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}': '@keyframes screen-in{from{transform:translateY(5px)}to{transform:none}}',
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'Expected CSS contract not found: {old}')
              css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')

          view_path = Path('backend/resources/views/safa/app.blade.php')
          view = view_path.read_text(encoding='utf-8')
          view_replacements = {
              '<select id="customer-filter">': '<select id="customer-filter" aria-label="{{ __(\'web.all_customers\') }}">',
              '<select id="customer-sort">': '<select id="customer-sort" aria-label="{{ __(\'web.newest_first\') }}">',
              '<select id="supplier-filter">': '<select id="supplier-filter" aria-label="{{ __(\'web.all_suppliers\') }}">',
              '<select id="supplier-sort">': '<select id="supplier-sort" aria-label="{{ __(\'web.newest_first\') }}">',
          }
          for old, new in view_replacements.items():
              if old not in view:
                  raise SystemExit(f'Expected select contract not found: {old}')
              view = view.replace(old, new, 1)
          view_path.write_text(view, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'safa-ci-migration'
          git config user.email 'safa-ci-migration@users.noreply.github.com'
          git add backend/public/safa-web-product.css backend/resources/views/safa/app.blade.php
          git commit -m 'fix(web): meet WCAG contrast naming and target-size gates'
          git push origin HEAD:i18n/245-web-accessibility
