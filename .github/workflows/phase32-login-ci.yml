name: Phase 32 Login CI

on:
  push:
    paths:
      - 'backend/app/Http/Controllers/MobileLoginController.php'
      - 'backend/app/Http/Middleware/RejectAmbiguousLoginIdentity.php'
      - 'backend/app/Http/Middleware/RejectInactiveLogin.php'
      - 'backend/app/Support/MobileNumber.php'
      - 'backend/tests/Feature/MobileLogin*.php'
      - 'backend/tests/Feature/Phase32*.php'
      - 'app/src/main/java/com/safa/account/data/network/LoginErrorResponseInterceptor.kt'
      - 'app/src/main/java/com/safa/account/ui/viewmodel/SafaViewModel.kt'
      - 'app/src/test/java/com/safa/account/data/api/Phase32LoginApiContractTest.kt'
      - 'app/src/test/java/com/safa/account/data/network/LoginErrorResponseInterceptorTest.kt'
      - '.github/workflows/phase32-login-ci.yml'
  pull_request:
    paths:
      - 'backend/app/Http/Controllers/MobileLoginController.php'
      - 'backend/app/Http/Middleware/RejectAmbiguousLoginIdentity.php'
      - 'backend/app/Http/Middleware/RejectInactiveLogin.php'
      - 'backend/app/Support/MobileNumber.php'
      - 'backend/tests/Feature/MobileLogin*.php'
      - 'backend/tests/Feature/Phase32*.php'
      - 'app/src/main/java/com/safa/account/data/network/LoginErrorResponseInterceptor.kt'
      - 'app/src/main/java/com/safa/account/ui/viewmodel/SafaViewModel.kt'
      - 'app/src/test/java/com/safa/account/data/api/Phase32LoginApiContractTest.kt'
      - 'app/src/test/java/com/safa/account/data/network/LoginErrorResponseInterceptorTest.kt'
      - '.github/workflows/phase32-login-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-phase32-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0
      - name: Run Phase 32 backend authentication tests
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG: 'false'
          APP_URL: http://localhost
          DB_CONNECTION: sqlite
          DB_DATABASE: database/testing.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          SAFA_API_KEY: safa_testing_key
          SAFA_API_SECRET: safa_testing_secret
          DB_UPDATE_SECRET: safa_testing_update_secret
          XDEBUG_MODE: off
        run: |
          mkdir -p database
          rm -f database/testing.sqlite
          touch database/testing.sqlite
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan test --no-coverage --do-not-cache-result \
            tests/Feature/MobileLoginApiTest.php \
            tests/Feature/MobileLoginRebindTest.php \
            tests/Feature/Phase32AuthIdentitySafetyTest.php \
            tests/Feature/Phase32AuthRouteContractTest.php \
            tests/Feature/Phase32AuthenticationContractTest.php \
            tests/Feature/Phase32CrossModelIdentityTest.php \
            tests/Feature/Phase32LoginThrottleTest.php

  android-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Run Phase 32 Android login tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace \
            --tests com.safa.account.data.api.Phase32LoginApiContractTest \
            --tests com.safa.account.data.network.LoginErrorResponseInterceptorTest
