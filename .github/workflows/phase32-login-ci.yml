name: Phase 32 Login CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-phase32-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-login:
    runs-on: [self-hosted, windows, x64, safa]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
      - name: Run Phase 32 backend authentication tests
        working-directory: backend
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force database | Out-Null
          if (Test-Path database/testing.sqlite) { Remove-Item database/testing.sqlite -Force }
          New-Item -ItemType File database/testing.sqlite | Out-Null
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan test --no-coverage --do-not-cache-result tests/Feature/MobileLoginApiTest.php tests/Feature/MobileLoginRebindTest.php tests/Feature/Phase32AuthIdentitySafetyTest.php tests/Feature/Phase32AuthRouteContractTest.php tests/Feature/Phase32AuthenticationContractTest.php tests/Feature/Phase32CrossModelIdentityTest.php tests/Feature/Phase32LoginThrottleTest.php

  android-login:
    runs-on: [self-hosted, windows, x64, safa]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Phase 32 Android login tests
        shell: powershell
        run: .\gradlew.bat testDebugUnitTest --no-daemon --stacktrace --tests com.safa.account.data.api.Phase32LoginApiContractTest --tests com.safa.account.data.network.LoginErrorResponseInterceptorTest
