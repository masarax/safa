name: Issue 33 migration and verification

on:
  push:
    paths:
      - '.github/workflows/issue33-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Apply Room-first migration and stable Android dependency
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('gradle/libs.versions.toml')
          s = p.read_text()
          s = s.replace('lifecycleRuntimeKtx = "2.8.7"', 'lifecycleRuntimeKtx = "2.9.6"')
          s = s.replace('lifecycleViewmodelCompose = "2.8.7"', 'lifecycleViewmodelCompose = "2.9.6"')
          s = s.replace('lifecycleRuntimeCompose = "2.8.7"', 'lifecycleRuntimeCompose = "2.9.6"')
          p.write_text(s)

          p = Path('app/src/main/java/com/safa/account/data/repository/AppRepository.kt')
          s = p.read_text()
          s = s.replace('import com.safa.account.data.local.LocalFirstStore\n', 'import com.safa.account.data.local.LocalFirstStore\nimport com.safa.account.data.local.RoomDomainRecord\nimport com.safa.account.data.local.RoomLocalDatabase\n')
          s = s.replace('import kotlinx.coroutines.withContext\n', 'import kotlinx.coroutines.withContext\nimport kotlinx.coroutines.runBlocking\n')
          s = s.replace('class AppRepository private constructor(private val api: ApiService, private val localStore: LocalFirstStore?) {', 'class AppRepository private constructor(private val api: ApiService, private val localStore: LocalFirstStore?, private val roomDatabase: RoomLocalDatabase?) {', 1)
          s = s.replace('constructor(api: ApiService) : this(api, null)', 'constructor(api: ApiService) : this(api, null, null)', 1)
          s = s.replace('constructor(context: Context) : this(remoteApi(context), LocalFirstStore(context.applicationContext))', 'constructor(context: Context) : this(remoteApi(context), LocalFirstStore(context.applicationContext), RoomLocalDatabase.get(context.applicationContext))', 1)
          old = '''    private fun persist(entity: String, localId: Int, serverId: Int, payload: Map<String, Any?>, operation: String, status: Int = LocalFirstStore.PENDING) {\n        val store = localStore ?: return\n        val json = mapToJson(payload)\n        store.upsertRecord(entity, localId, serverId, json, status)\n        if (status != LocalFirstStore.SYNCED) store.enqueue(entity, localId, serverId, operation, json)\n    }'''
          new = '''    private fun persist(entity: String, localId: Int, serverId: Int, payload: Map<String, Any?>, operation: String, status: Int = LocalFirstStore.PENDING) {\n        val store = localStore ?: return\n        val json = mapToJson(payload)\n        store.upsertRecord(entity, localId, serverId, json, status)\n        roomDatabase?.let { db -> runBlocking(Dispatchers.IO) {\n            val obj = runCatching { JSONObject(json) }.getOrNull()\n            val version = obj?.optLong("sync_version", 0L)?.coerceAtMost(Int.MAX_VALUE.toLong())?.toInt() ?: 0\n            val mutation = obj?.optJSONObject("_sync")?.optString("mutation_id")?.takeIf { it.isNotBlank() }\n            db.domainRecords().upsert(RoomDomainRecord(entity, localId, serverId, json, version, status, mutation, System.currentTimeMillis()))\n        }}\n        if (status != LocalFirstStore.SYNCED) store.enqueue(entity, localId, serverId, operation, json)\n    }'''
          assert old in s
          s = s.replace(old, new, 1)
          start = s.index('    private fun publish() {')
          end = s.index('    private fun loadLocalSnapshot()', start)
          publish = '''    private fun publish() {\n        val store = localStore ?: return\n        val room = roomDatabase ?: run { publishFromLegacyStore(store); return }\n        runBlocking(Dispatchers.IO) {\n            val entities = listOf("customers", "suppliers", "transactions", "supplier_deposits", "expenses_incomes", "wallet_ledgers", "wallet_batches", "operators")\n            for (entity in entities) if (room.domainRecords().count(entity) == 0) {\n                val legacy = store.getRecordPayloads(entity)\n                if (legacy.isNotEmpty()) room.domainRecords().upsertAll(legacy.map { row ->\n                    val obj = runCatching { JSONObject(row.payload) }.getOrNull()\n                    RoomDomainRecord(row.entity, row.localId, row.serverId, row.payload, obj?.optLong("sync_version", 0L)?.coerceAtMost(Int.MAX_VALUE.toLong())?.toInt() ?: 0, row.syncStatus, obj?.optJSONObject("_sync")?.optString("mutation_id")?.takeIf { it.isNotBlank() }, System.currentTimeMillis())\n                })\n            }\n            fun rows(entity: String) = room.domainRecords().getAll(entity)\n            _customers.value = rows("customers").mapNotNull { runCatching { customer(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n            _suppliers.value = rows("suppliers").mapNotNull { runCatching { supplier(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n            _transactions.value = rows("transactions").mapNotNull { runCatching { transaction(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n            _deposits.value = rows("supplier_deposits").mapNotNull { runCatching { deposit(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n            _expenses.value = rows("expenses_incomes").mapNotNull { runCatching { expense(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n            _ledgers.value = rows("wallet_ledgers").mapNotNull { runCatching { ledger(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n            _batches.value = rows("wallet_batches").mapNotNull { runCatching { batch(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n            _operators.value = rows("operators").mapNotNull { runCatching { operator(jsonToMap(it.payload)) }.getOrNull() }\n        }\n    }\n\n    private fun publishFromLegacyStore(store: LocalFirstStore) {\n        _customers.value = store.getRecordPayloads("customers").mapNotNull { runCatching { customer(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n        _suppliers.value = store.getRecordPayloads("suppliers").mapNotNull { runCatching { supplier(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n        _transactions.value = store.getRecordPayloads("transactions").mapNotNull { runCatching { transaction(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n        _deposits.value = store.getRecordPayloads("supplier_deposits").mapNotNull { runCatching { deposit(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n        _expenses.value = store.getRecordPayloads("expenses_incomes").mapNotNull { runCatching { expense(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n        _ledgers.value = store.getRecordPayloads("wallet_ledgers").mapNotNull { runCatching { ledger(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n        _batches.value = store.getRecordPayloads("wallet_batches").mapNotNull { runCatching { batch(jsonToMap(it.payload)) }.getOrNull() }.filter { it.deletedAt == null }\n        _operators.value = store.getRecordPayloads("operators").mapNotNull { runCatching { operator(jsonToMap(it.payload)) }.getOrNull() }\n    }\n'''
          s = s[:start] + publish + s[end:]
          p.write_text(s)

          t = Path('app/src/test/java/com/safa/account/ArchitectureIssue33Test.kt')
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text('''package com.safa.account\n\nimport org.junit.Test\nimport kotlin.test.assertTrue\n\nclass ArchitectureIssue33Test {\n    @Test fun roomArchitectureIsPresent() {\n        val source = java.io.File("src/main/java/com/safa/account/data/local/RoomLocalDatabase.kt").readText()\n        assertTrue(source.contains("@Database"))\n        assertTrue(source.contains("RoomDomainRecord"))\n        assertTrue(source.contains("domain_records"))\n    }\n}\n''')
          PY
          git diff --check
      - name: Run Android regression suite
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace
      - name: Run backend regression suite
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: database/testing.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          mkdir -p database
          touch database/testing.sqlite
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan test --no-coverage --do-not-cache-result
      - name: Commit verified changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle/libs.versions.toml app/src/main/java/com/safa/account/data/repository/AppRepository.kt app/src/test/java/com/safa/account/ArchitectureIssue33Test.kt
          git commit -m 'fix(issue-33): make Room authoritative for offline domain data'
          git push
          git rm .github/workflows/issue33-migration.yml
          git commit -m 'chore(ci): remove temporary issue 33 migration workflow'
          git push
