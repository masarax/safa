name: Issue 245 runtime copy migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-245-runtime-copy-migration.yml'
      - 'backend/public/safa-web.js'

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'i18n/245-web-accessibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout guarded branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: i18n/245-web-accessibility
          fetch-depth: 0

      - name: Extract bilingual runtime copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          source_path = Path('backend/public/safa-web.js')
          source = source_path.read_text(encoding='utf-8')
          literal_pair = re.compile(r"text\(\s*'((?:\\.|[^'\\])*)'\s*,\s*'((?:\\.|[^'\\])*)'\s*\)")
          template_pair = re.compile(r"text\(\s*`((?:\\.|[^`\\])*)`\s*,\s*`((?:\\.|[^`\\])*)`\s*\)")
          expression = re.compile(r"\$\{([^{}]+)\}")

          def unescape_js(value: str) -> str:
              return (value.replace('\\\\', '\x00').replace("\\'", "'")
                  .replace('\\n', '\n').replace('\\r', '\r').replace('\\t', '\t')
                  .replace('\x00', '\\'))

          def slug(value: str) -> str:
              plain = expression.sub(' value ', value)
              base = re.sub(r'[^a-z0-9]+', '_', plain.lower()).strip('_') or 'copy'
              return base[:56].rstrip('_')

          catalog = {}
          reverse = {}
          def key_for(en: str, bn: str) -> str:
              pair_key = (en, bn)
              key = reverse.get(pair_key)
              if key is None:
                  key = 'runtime_' + slug(en)
                  if key in catalog and catalog[key] != pair_key:
                      key += '_' + hashlib.sha1((en + '\0' + bn).encode()).hexdigest()[:8]
                  catalog[key] = pair_key
                  reverse[pair_key] = key
              return key

          def replace_literal(match: re.Match) -> str:
              en, bn = unescape_js(match.group(1)), unescape_js(match.group(2))
              return f"t('{key_for(en, bn)}')"

          def replace_template(match: re.Match) -> str:
              en_raw, bn_raw = match.group(1), match.group(2)
              en_expr = [item.strip() for item in expression.findall(en_raw)]
              bn_expr = [item.strip() for item in expression.findall(bn_raw)]
              if en_expr != bn_expr:
                  raise SystemExit(f'Dynamic EN/BN expression mismatch: {en_expr!r} != {bn_expr!r}')
              en = expression.sub(lambda m: '{p%d}' % en_expr.index(m.group(1).strip()), en_raw)
              bn = expression.sub(lambda m: '{p%d}' % bn_expr.index(m.group(1).strip()), bn_raw)
              key = key_for(unescape_js(en), unescape_js(bn))
              if not en_expr:
                  return f"t('{key}')"
              values = ', '.join(f"p{index}: {expr}" for index, expr in enumerate(en_expr))
              return f"tf('{key}', {{{values}}})"

          migrated, literal_count = literal_pair.subn(replace_literal, source)
          migrated, template_count = template_pair.subn(replace_template, migrated)
          old = "  const bn = app.dataset.language === 'bn';\n  const text = (en, bengali) => bn ? bengali : en;"
          new = "  let copy = {};\n  try { copy = JSON.parse(app.dataset.webCopy || '{}'); } catch (_) { copy = {}; }\n  const t = key => String(copy[key] ?? key);\n  const tf = (key, vars = {}) => Object.entries(vars).reduce((value, [name, replacement]) => value.replaceAll(`{${name}}`, String(replacement)), t(key));"
          if literal_count + template_count == 0 or old not in migrated:
              raise SystemExit('Expected bilingual copy/helper declaration not found.')
          migrated = migrated.replace(old, new, 1)

          leftovers = [line.strip() for line in migrated.splitlines() if 'text(' in line]
          if leftovers:
              print('\n'.join(leftovers[:80]), flush=True)
              raise SystemExit('Unmigrated text(...) calls remain.')
          bangla = [line.strip() for line in migrated.splitlines() if re.search(r'[\u0980-\u09FF]', line)]
          if bangla:
              print('\n'.join(bangla[:80]), flush=True)
              raise SystemExit('Bangla literals remain in safa-web.js.')

          def php_quote(value: str) -> str:
              return value.replace('\\', '\\\\').replace("'", "\\'").replace('\n', '\\n').replace('\r', '\\r')
          def write_catalog(path: str, index: int):
              lines = ['<?php', '', 'return [']
              for key in sorted(catalog):
                  lines.append(f"    '{key}' => '{php_quote(catalog[key][index])}',")
              lines += ['];', '']
              Path(path).write_text('\n'.join(lines), encoding='utf-8')

          source_path.write_text(migrated, encoding='utf-8')
          write_catalog('backend/lang/en/web_runtime.php', 0)
          write_catalog('backend/lang/bn/web_runtime.php', 1)
          print(f'Migrated {literal_count} literal and {template_count} dynamic calls into {len(catalog)} runtime keys.')
          PY

      - name: Validate migration output
        shell: bash
        run: |
          node --check backend/public/safa-web.js
          php -l backend/lang/en/web_runtime.php
          php -l backend/lang/bn/web_runtime.php
          ! grep -n 'text(' backend/public/safa-web.js
          ! grep -nP '[\x{0980}-\x{09FF}]' backend/public/safa-web.js

      - name: Commit migrated runtime copy
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'safa-ci-migration'
          git config user.email 'safa-ci-migration@users.noreply.github.com'
          git add backend/public/safa-web.js backend/lang/en/web_runtime.php backend/lang/bn/web_runtime.php
          git commit -m 'refactor(i18n): centralize primary web runtime copy'
          git push origin HEAD:i18n/245-web-accessibility
