name: Android CI

on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', 'gradlew', 'gradlew.bat', '*.gradle.kts', 'gradle.properties', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['app/**', 'gradle/**', 'gradlew', 'gradlew.bat', '*.gradle.kts', 'gradle.properties', '.github/workflows/android-ci.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - run: ./gradlew lintDebug --no-daemon --stacktrace
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
