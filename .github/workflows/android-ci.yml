name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: [self-hosted, windows, x64, safa]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew.bat testDebugUnitTest --no-daemon --stacktrace
      - run: ./gradlew.bat lintDebug --no-daemon --stacktrace
      - run: ./gradlew.bat assembleDebug --no-daemon --stacktrace
