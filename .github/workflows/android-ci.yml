name: Android CI

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - run: ./gradlew lintDebug --no-daemon --stacktrace
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
