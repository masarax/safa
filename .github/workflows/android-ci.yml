name: Android Production CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'release/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'release/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-release:
    name: Unit, lint and release build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate monotonically increasing release version
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's/^SAFA_VERSION_CODE=//p' gradle.properties | tail -n 1 | tr -d '[:space:]')"
          published="$(tr -d '[:space:]' < release/android-last-published-version-code.txt)"
          [[ "$current" =~ ^[0-9]+$ ]] || { echo 'SAFA_VERSION_CODE must be an integer'; exit 1; }
          [[ "$published" =~ ^[0-9]+$ ]] || { echo 'Published version baseline must be an integer'; exit 1; }
          test "$current" -gt "$published" || { echo "Release versionCode $current must be greater than last published code $published"; exit 1; }

      - name: Run debug unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safa-debug-apk-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

      - name: Run plain local-equivalent assembleRelease
        env:
          KEYSTORE_PATH: ''
          STORE_PASSWORD: ''
          KEY_ALIAS: ''
          KEY_PASSWORD: ''
        run: |
          rm -rf app/build/outputs/apk/release
          ./gradlew --no-daemon assembleRelease
          test -n "$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"

      - name: Create ephemeral CI release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/safa-ci-release.jks" \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias safa-ci \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=SAFA CI,OU=CI,O=MASARA X,L=Riyadh,C=SA"

      - name: Build minified signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/safa-ci-release.jks
          STORE_PASSWORD: ci-only-password
          KEY_ALIAS: safa-ci
          KEY_PASSWORD: ci-only-password
        run: |
          rm -rf app/build/outputs/apk/release
          ./gradlew --no-daemon assembleRelease
          test -n "$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"

      - name: Upload release build and reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-quality-release-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml

  instrumentation:
    name: Emulator instrumentation and release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create ephemeral runtime signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/safa-ci-runtime.jks" \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias safa-ci \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=SAFA CI Runtime,OU=CI,O=MASARA X,L=Riyadh,C=SA"

      - name: Build release APK before emulator
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/safa-ci-runtime.jks
          STORE_PASSWORD: ci-only-password
          KEY_ALIAS: safa-ci
          KEY_PASSWORD: ci-only-password
        run: |
          rm -rf app/build/outputs/apk/release
          ./gradlew --no-daemon assembleRelease
          release_apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$release_apk"
          cp "$release_apk" "$RUNNER_TEMP/safa-release-smoke.apk"
          # Release intermediates are several GB and are no longer needed once the
          # signed APK is preserved. Reclaim them before installing the API 35
          # system image/AVD so hosted-runner disk pressure cannot block boot.
          rm -rf app/build
          df -h . "$RUNNER_TEMP"

      - name: Run connected tests and release runtime smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/safa-ci-runtime.jks
          STORE_PASSWORD: ci-only-password
          KEY_ALIAS: safa-ci
          KEY_PASSWORD: ci-only-password
          RELEASE_APK_PATH: ${{ runner.temp }}/safa-release-smoke.apk
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # API 35's system image needs about 5.3GB in addition to userdata.
          # Keep userdata compact; the test and release APK payloads fit well
          # below this while the host retains enough space for Gradle test output.
          disk-size: 1024M
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            test -f "$RELEASE_APK_PATH"
            adb install -r "$RELEASE_APK_PATH"
            adb logcat -c
            adb shell am force-stop com.safa.account
            adb shell am start -W -n com.safa.account/.MainActivity
            sleep 3
            adb shell pidof com.safa.account || adb logcat -d -b crash -v threadtime | tee app/build/release-smoke-crash.log
            adb shell pidof com.safa.account || adb logcat -d -v threadtime -t 400 | grep -E 'FATAL EXCEPTION|AndroidRuntime|SafaApp|SAFA_DIAGNOSTIC|com\.safa\.account' | tee app/build/release-smoke-logcat.log
            adb shell pidof com.safa.account | grep -q '[0-9]'

      - name: Restore release APK for diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/safa-release-smoke.apk" ]; then
            mkdir -p app/build/outputs/apk/release
            cp "$RUNNER_TEMP/safa-release-smoke.apk" app/build/outputs/apk/release/safa-release-smoke.apk
          fi

      - name: Upload instrumentation and release-smoke results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-instrumentation-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/apk/release/*.apk
            app/build/release-smoke-*.log
