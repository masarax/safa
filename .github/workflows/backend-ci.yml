name: Laravel Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.cpanel.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.cpanel.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax and full Laravel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0

      - name: Prepare test environment
        working-directory: backend
        shell: bash
        run: |
          mkdir -p database
          rm -f database/testing.sqlite
          touch database/testing.sqlite
          cp .env.example .env
          php -r '$env=file_get_contents(".env"); $key="base64:".base64_encode(random_bytes(32)); $env=preg_replace("/^APP_KEY=.*$/m", "APP_KEY=$key", $env); $env=preg_replace("/^DB_CONNECTION=.*$/m", "DB_CONNECTION=sqlite", $env); $env=preg_replace("/^DB_DATABASE=.*$/m", "DB_DATABASE=".getcwd()."/database/testing.sqlite", $env); file_put_contents(".env", $env);'

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP syntax check
        working-directory: backend
        run: find app config database deploy routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Deployment shell syntax check
        working-directory: backend
        shell: bash
        run: bash -n deploy/cpanel-deploy.sh

      - name: Run full test suite
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          php -d memory_limit=1G -d max_execution_time=0 -d opcache.enable=0 -d opcache.jit=0 artisan test --no-coverage --do-not-cache-result 2>&1 | tee ../backend-test-output.txt

      - name: Upload backend test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-output-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: backend-test-output.txt
