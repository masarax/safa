name: Laravel Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/**'
      - 'scripts/check-workflow-action-pins.sh'
      - 'scripts/check-deploy-provenance.sh'
      - 'scripts/php-security-scan.php'
      - 'security/**'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
      - 'scripts/check-workflow-action-pins.sh'
      - 'scripts/check-deploy-provenance.sh'
      - 'scripts/php-security-scan.php'
      - 'security/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax and full Laravel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify immutable workflow action pins
        run: bash scripts/check-workflow-action-pins.sh

      - name: Verify deployment provenance contract
        run: bash scripts/check-deploy-provenance.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0

      - name: Prepare test environment
        working-directory: backend
        shell: bash
        run: |
          mkdir -p database
          rm -f database/testing.sqlite
          touch database/testing.sqlite
          cp .env.example .env
          php -r '$env=file_get_contents(".env"); $key="base64:".base64_encode(random_bytes(32)); $env=preg_replace("/^APP_KEY=.*$/m", "APP_KEY=$key", $env); $env=preg_replace("/^DB_CONNECTION=.*$/m", "DB_CONNECTION=sqlite", $env); $env=preg_replace("/^DB_DATABASE=.*$/m", "DB_DATABASE=".getcwd()."/database/testing.sqlite", $env); file_put_contents(".env", $env);'

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Block vulnerable production Composer dependencies
        working-directory: backend
        env:
          COMPOSER_AUDIT_ABANDONED: fail
        run: composer audit --locked --no-dev --format=summary

      - name: PHP security static analysis
        run: php scripts/php-security-scan.php

      - name: PHP syntax check
        working-directory: backend
        run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Browser JavaScript syntax check
        working-directory: backend
        run: find public -maxdepth 1 -type f -name 'safa-web*.js' -print0 | xargs -0 -n1 node --check

      - name: Run full test suite
        working-directory: backend
        run: php -d memory_limit=1G -d max_execution_time=0 -d opcache.enable=0 -d opcache.jit=0 artisan test --no-coverage --do-not-cache-result

  mysql-parity:
    name: MySQL 8 strict migrations and full tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: safa_test
      DB_USERNAME: safa
      DB_PASSWORD: safa_test_password
      DB_URL: ''
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: safa_test
          MYSQL_USER: safa
          MYSQL_PASSWORD: safa_test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify immutable workflow action pins
        run: bash scripts/check-workflow-action-pins.sh

      - name: Verify deployment provenance contract
        run: bash scripts/check-deploy-provenance.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, pcntl, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0

      - name: Prepare MySQL test environment
        working-directory: backend
        shell: bash
        run: |
          cp .env.example .env
          php -r '$env=file_get_contents(".env"); $key="base64:".base64_encode(random_bytes(32)); $env=preg_replace("/^APP_KEY=.*$/m", "APP_KEY=$key", $env); file_put_contents(".env", $env);'
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306", "root", "root_password", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $pdo->exec("SET GLOBAL sql_mode=\"STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION\"");'
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306;dbname=safa_test", "safa", "safa_test_password", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $mode=(string) $pdo->query("SELECT @@SESSION.sql_mode")->fetchColumn(); if (!str_contains($mode, "STRICT_TRANS_TABLES")) { fwrite(STDERR, "MySQL strict mode is required\n"); exit(1); } echo $mode, PHP_EOL;'

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Smoke first-run browser bootstrap on empty MySQL
        working-directory: backend
        env:
          SAFA_MYSQL_FIRST_RUN_SMOKE: '1'
        run: php -d memory_limit=1G -d max_execution_time=0 artisan test --no-coverage --do-not-cache-result --filter=FirstRunDatabaseBootstrapMySqlTest

      - name: Reset and migrate clean MySQL database
        working-directory: backend
        run: php artisan migrate:fresh --force --no-interaction

      - name: Run full test suite on MySQL
        working-directory: backend
        run: php -d memory_limit=1G -d max_execution_time=0 -d opcache.enable=0 -d opcache.jit=0 artisan test --no-coverage --do-not-cache-result
