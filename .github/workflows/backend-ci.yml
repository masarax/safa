name: Backend CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-backend-ci-manual
  cancel-in-progress: true

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
          ini-values: memory_limit=1G, max_execution_time=0, opcache.enable=0, opcache.jit=0

      - name: Prepare test database
        run: |
          mkdir -p database
          rm -f database/testing.sqlite
          touch database/testing.sqlite

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Clear Laravel configuration cache
        run: php artisan config:clear

      - name: PHP syntax check
        run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run full Laravel test suite
        env:
          XDEBUG_MODE: off
        run: php -d memory_limit=1G -d max_execution_time=0 -d opcache.enable=0 -d opcache.jit=0 artisan test --no-coverage --do-not-cache-result
