name: Backend CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safa-backend-ci-manual
  cancel-in-progress: true

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost
      SAFA_API_KEY: safa_testing_key
      SAFA_API_SECRET: safa_testing_secret
      DB_UPDATE_SECRET: safa_testing_update_secret
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_sqlite, bcmath, ctype, fileinfo, json, tokenizer
          coverage: none
      - name: Prepare CI environment
        run: cp .env.testing .env
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: find app config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan migrate --force
      - run: php artisan test
