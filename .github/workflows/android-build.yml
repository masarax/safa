name: Build & Test Android APK

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # manual trigger button in GitHub UI

jobs:
  backend-test:
    name: Laravel Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, json, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup .env
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "SAFA_API_KEY=${{ secrets.SAFA_API_KEY || 'ci_test_key_2026' }}" >> .env
          echo "SAFA_API_SECRET=${{ secrets.SAFA_API_SECRET || 'ci_test_secret_32byteslong_2026' }}" >> .env

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations + seed
        run: php artisan migrate --force && php artisan db:seed

      - name: Run PHPUnit tests
        run: php artisan test

  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: backend-test   # only build if backend tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create app .env (Secrets Plugin)
        run: |
          cat > app/.env << 'EOF'
          SAFA_API_KEY=${{ secrets.SAFA_API_KEY || 'ci_test_key_2026' }}
          SAFA_API_SECRET=${{ secrets.SAFA_API_SECRET || 'ci_test_secret_32byteslong_2026' }}
          SAFA_BASE_URL=https://api.safa-account.com/api/
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'placeholder' }}
          EOF

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safa-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-apk

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
        if: secrets.KEYSTORE_BASE64 != ''

      - name: Create app .env
        run: |
          cat > app/.env << 'EOF'
          SAFA_API_KEY=${{ secrets.SAFA_API_KEY }}
          SAFA_API_SECRET=${{ secrets.SAFA_API_SECRET }}
          SAFA_BASE_URL=https://api.safa-account.com/api/
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'placeholder' }}
          EOF

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx4g"
        if: secrets.KEYSTORE_BASE64 != ''

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: safa-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
        if: secrets.KEYSTORE_BASE64 != ''
