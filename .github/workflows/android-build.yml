name: Android Build Verification

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'build.gradle*'
      - 'gradlew'
      - 'gradlew.bat'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile and assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
