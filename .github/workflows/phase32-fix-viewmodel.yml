name: Phase 32 ViewModel fix
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Patch source and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          p = Path('app/src/main/java/com/safa/account/ui/viewmodel/SafaViewModel.kt')
          s = p.read_text()
          r = '''    private fun extractLoginErrorMessage(raw: String): String {
        val body = raw.trim()
        if (body.isBlank()) return t("invalid_credentials")
        if (!body.startsWith("{")) return body
        return try {
            val json = org.json.JSONObject(body)
            val directMessage = json.optString("message").trim()
            if (directMessage.isNotBlank()) {
                directMessage
            } else {
                val errors = json.optJSONObject("errors")
                val messages = mutableListOf<String>()
                if (errors != null) {
                    val keys = errors.keys()
                    while (keys.hasNext()) {
                        val key = keys.next()
                        val value = errors.opt(key)
                        when (value) {
                            is org.json.JSONArray -> {
                                for (i in 0 until value.length()) {
                                    value.optString(i).takeIf { it.isNotBlank() }?.let(messages::add)
                                }
                            }
                            else -> value?.toString()?.takeIf { it.isNotBlank() }?.let(messages::add)
                        }
                    }
                }
                if (messages.isNotEmpty()) messages.joinToString(" ") else t("invalid_credentials")
            }
        } catch (_: Exception) {
            t("invalid_credentials")
        }
    }

'''
          pat = re.compile(r'    private fun extractLoginErrorMessage\(raw: String\): String \{.*?\n    \}\n\n    // loginWithMobileAndPin\(\) REMOVED', re.S)
          s2, n = pat.subn(r + '    // loginWithMobileAndPin() REMOVED', s, 1)
          if n != 1:
              raise SystemExit('target method not found')
          p.write_text(s2)
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add',str(p)], check=True)
          subprocess.run(['git','rm','.github/workflows/phase32-fix-viewmodel.yml'], check=True)
          subprocess.run(['git','commit','-m','fix(android): compile phase 32 login error handling'], check=True)
          subprocess.run(['git','push','origin','main'], check=True)
          PY
