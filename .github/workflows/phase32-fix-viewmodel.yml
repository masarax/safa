name: Phase 32 ViewModel fix

on:
  push:
    paths:
      - '.github/workflows/phase32-fix-viewmodel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch ViewModel and remove this workflow
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'app/src/main/java/com/safa/account/ui/viewmodel/SafaViewModel.kt';
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const current = Buffer.from(file.data.content, 'base64').toString('utf8');
            const replacement = `    private fun extractLoginErrorMessage(raw: String): String {
                val body = raw.trim()
                if (body.isBlank()) return t("invalid_credentials")
                if (!body.startsWith("{")) return body

                return try {
                    val json = org.json.JSONObject(body)
                    val directMessage = json.optString("message").trim()
                    if (directMessage.isNotBlank()) {
                        directMessage
                    } else {
                        val errors = json.optJSONObject("errors")
                        val messages = mutableListOf<String>()
                        if (errors != null) {
                            val keys = errors.keys()
                            while (keys.hasNext()) {
                                val key = keys.next()
                                val value = errors.opt(key)
                                when (value) {
                                    is org.json.JSONArray -> {
                                        for (i in 0 until value.length()) {
                                            value.optString(i).takeIf { it.isNotBlank() }?.let(messages::add)
                                        }
                                    }
                                    else -> value?.toString()?.takeIf { it.isNotBlank() }?.let(messages::add)
                                }
                            }
                        }
                        if (messages.isNotEmpty()) messages.joinToString(" ") else t("invalid_credentials")
                    }
                } catch (_: Exception) {
                    t("invalid_credentials")
                }
            }

`;
            const pattern = /    private fun extractLoginErrorMessage\(raw: String\): String \{[\s\S]*?\n    \}\n\n    \/\/ loginWithMobileAndPin\(\) REMOVED/;
            if (!pattern.test(current)) throw new Error('Phase 32 parser block not found');
            const updated = current.replace(pattern, replacement + '    // loginWithMobileAndPin() REMOVED');
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'fix(android): compile phase 32 login error handling',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: file.data.sha,
              branch: 'main'
            });

            const workflowPath = '.github/workflows/phase32-fix-viewmodel.yml';
            const workflow = await github.rest.repos.getContent({ owner, repo, path: workflowPath, ref: 'main' });
            await github.rest.repos.deleteFileContents({
              owner,
              repo,
              path: workflowPath,
              message: 'chore: remove temporary phase 32 patch workflow',
              sha: workflow.data.sha,
              branch: 'main'
            });
