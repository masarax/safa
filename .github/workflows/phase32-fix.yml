name: Phase 32 Fix

on:
  push:
    paths:
      - '.github/workflows/phase32-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Android login error contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/safa/account/ui/viewmodel/SafaViewModel.kt')
          text = path.read_text()
          if 'import org.json.JSONObject' not in text:
              text = text.replace('import java.util.*\n', 'import java.util.*\nimport org.json.JSONObject\n')
          old = 'onResult(false, if (errorStr.isNotBlank() && !errorStr.startsWith("{")) errorStr else t("invalid_credentials"))'
          new = '''val message = if (errorStr.isNotBlank()) {
                            runCatching {
                                val json = JSONObject(errorStr)
                                json.optString("message").takeIf { it.isNotBlank() }
                                    ?: json.optJSONObject("errors")?.let { errors ->
                                        errors.keys().asSequence()
                                            .mapNotNull { key -> errors.optJSONArray(key)?.optString(0) }
                                            .firstOrNull { it.isNotBlank() }
                                    }
                            }.getOrNull() ?: errorStr
                        } else {
                            t("invalid_credentials")
                        }
                        onResult(false, message)'''
          if old not in text:
              raise SystemExit('Expected login error masking expression was not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Verify Android tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
          ./gradlew lintDebug --no-daemon --stacktrace
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase32-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/safa/account/ui/viewmodel/SafaViewModel.kt .github/workflows/phase32-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(auth): preserve backend login errors in Android"
          git push origin HEAD:main
